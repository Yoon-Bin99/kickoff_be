# 빌드 데몬 자체의 인코딩. build.gradle 의 태스크별 설정과 짝이다 —
# 태스크에 걸어도 데몬이 MS949 로 떠 있으면 데몬이 직접 하는 일(리소스 복사,
# 로그 출력 등)은 여전히 플랫폼 코드페이지를 따른다.
#
# JDK 17 은 JEP 400 이전이라 file.encoding 이 OS 코드페이지를 따라간다.
# 한국어 윈도우에서는 MS949, 운영 리눅스 컨테이너에서는 또 다른 값이다.
# 자세한 배경은 build.gradle 의 인코딩 블록 주석 참고.
# 메모리 값은 Gradle 의 기본값을 그대로 옮겨 적은 것이다. org.gradle.jvmargs 를 지정하면
# 기본값이 통째로 대체되므로, 인코딩만 적으면 힙 설정이 조용히 JVM 기본으로 바뀐다.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
