plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kickoff'
version = '0.0.1-SNAPSHOT'
description = 'be'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // Boot 4 는 자동설정이 모듈로 쪼개져 있다. flyway-core 만 넣으면 라이브러리는 있는데
    // 스프링이 마이그레이션을 돌려주지 않는다 — 이 모듈이 그 연결을 담당한다.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    // Flyway 10 부터 DB 별 지원이 모듈로 쪼개졌다. H2 는 core 에 있고 PostgreSQL 은 별도다.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    // 카카오 장소 검색을 부르는 RestClient 용. webmvc 스타터에는 RestClient 클래스만 들어
    // 있고 RestClient.Builder <b>빈</b>을 만들어 주는 자동설정은 이 모듈에 있다 — 빠뜨리면
    // 기동이 NoSuchBeanDefinition 으로 죽는다 (flyway 와 같은 함정).
    implementation 'org.springframework.boot:spring-boot-restclient'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // 같은 통합 테스트를 실제 PostgreSQL 로도 돌리기 위한 것. 기본 test 는 여전히 H2 라
    // 이 의존성이 있어도 Docker 없이 ./gradlew test 는 그대로 돈다.
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

/*
 * 약관·개인정보처리방침 마크다운을 jar 에 싣는다 (계약서 §3, v1.21.0).
 *
 * 원본은 docs/ 에 있고 사람이 거기서 고친다. 그런데 docs/ 는 클래스패스가 아니라서
 * 배포된 jar 안에서는 읽을 수 없다 — 그래서 빌드할 때 리소스로 복사한다.
 *
 * <b>복사본을 저장소에 두지 않는 게 핵심이다.</b> 두 벌을 커밋해 두면 docs/ 만 고치고
 * 배포하는 날이 오는데, 그때 페이지는 옛 문서를 계속 내놓으면서 에러는 없다. 문의처가
 * 바뀌었는데 예전 주소가 그대로 보이는 식이다. 빌드가 매번 복사하면 어긋날 자리가 없다.
 */
tasks.named('processResources') {
    from('docs') {
        include 'terms-of-service.md'
        include 'privacy-policy.md'
        into 'legal'
    }

    /*
     * 복사가 실제로 됐는지 확인하고, 안 됐으면 <b>빌드를 세운다.</b>
     *
     * Gradle 의 from() 은 원본 디렉터리가 없어도 조용히 성공한다. 그래서 docs/ 가 없는
     * 환경에서 빌드하면 리소스가 빠진 jar 가 아무 경고 없이 만들어지고, 그걸 배포하면
     * /terms·/privacy 만 500 이 난다 — API 는 멀쩡해서 한참 모른다.
     *
     * 2026-09-01 에 정확히 그렇게 배포했다. .dockerignore 가 docs 를 빼고 있었고
     * Dockerfile 도 복사하지 않았는데, 로컬은 docs/ 가 있어서 테스트까지 다 통과했다.
     * <b>로컬 빌드와 배포 빌드가 다르다</b>는 걸 테스트로는 잡을 수 없어서 여기서 잡는다.
     */
    doLast {
        def dir = layout.buildDirectory.dir('resources/main/legal').get().asFile
        ['terms-of-service.md', 'privacy-policy.md'].each { name ->
            if (!new File(dir, name).exists()) {
                throw new GradleException("""약관 문서가 리소스에 안 실렸습니다: legal/${name}
  docs/${name} 가 빌드 컨텍스트에 있는지 확인하세요.
  도커 빌드라면 .dockerignore 의 docs 예외와 Dockerfile 의 COPY docs docs 를 함께 보세요.
  이 검사가 없으면 리소스가 빠진 jar 가 조용히 만들어져 운영에서 /terms·/privacy 만 500 이 납니다.""")
            }
        }
    }
}

/*
 * 같은 통합 테스트를 실제 PostgreSQL 컨테이너에서 한 번 더 돌린다.
 *
 * 테스트를 따로 쓰지 않고 <b>같은 클래스를 다시 실행</b>하는 게 핵심이다. PG 전용 테스트를
 * 별도로 두면 시간이 지나며 커버리지가 벌어지고, 정작 새로 추가한 쿼리는 H2 에서만 검증되는
 * 상태가 된다 — lower(bytea) 사고가 정확히 그런 종류였다.
 *
 * 기본 test 는 H2 그대로다. Docker 가 없는 환경에서도 개발이 막히지 않아야 하고,
 * 빠른 피드백 루프도 지켜야 한다.
 */
tasks.register('postgresTest', Test) {
    group = 'verification'
    description = '통합 테스트를 실제 PostgreSQL 컨테이너에서 실행한다 (Docker 필요)'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()

    // IntegrationTestSupport 가 이 값을 보고 컨테이너를 띄운다.
    systemProperty 'kickoff.test.db', 'postgres'

    // 결과를 기본 test 와 섞지 않는다. 두 실행의 성패를 따로 봐야 한다.
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/postgresTest')
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/postgresTest')
    binaryResultsDirectory = layout.buildDirectory.dir('test-results/postgresTest/binary')

    shouldRunAfter tasks.named('test')
}


