plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kickoff'
version = '0.0.1-SNAPSHOT'
description = 'be'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

/*
 * 인코딩을 UTF-8 로 못 박는다. 세 JVM(빌드 데몬·테스트·bootRun)이 전부 같아야 한다.
 *
 * JDK 17 은 JEP 400(UTF-8 기본화) 이전 버전이라 file.encoding 이 플랫폼 코드페이지를
 * 그대로 따른다. 한국어 윈도우에서는 MS949 다 — 실제로 이 저장소를 새 PC 로 옮겼을 때
 * 데몬이 -Dfile.encoding=x-windows-949 로 떴다. 운영은 리눅스 컨테이너라 값이 다르다.
 * 즉 인코딩을 안 박아두면 빌드 결과가 머신 로케일에 따라 달라진다.
 *
 * 지금 코드는 charset 을 명시하는 자리들 덕에 안 터지지만, charset 없는 getBytes() 나
 * FileReader 가 하나 들어오는 순간 "로컬만 통과하고 운영에서 깨지는" 종류의 버그가 된다.
 *
 * compileJava 는 Boot 플러그인이 이미 UTF-8 을 넣어주고 있다(실측 확인). 그래도 명시한다 —
 * 플러그인이 해주는 것과 우리가 요구하는 것은 다른 문제이고, 플러그인 버전이 바뀌면 조용히
 * 사라질 수 있다. 이 블록을 "어차피 해주는데 왜 있지" 하고 지우지 말 것.
 */
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}
tasks.withType(JavaExec).configureEach {   // bootRun 포함
    systemProperty 'file.encoding', 'UTF-8'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // Boot 4 는 자동설정이 모듈로 쪼개져 있다. flyway-core 만 넣으면 라이브러리는 있는데
    // 스프링이 마이그레이션을 돌려주지 않는다 — 이 모듈이 그 연결을 담당한다.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    // Flyway 10 부터 DB 별 지원이 모듈로 쪼개졌다. H2 는 core 에 있고 PostgreSQL 은 별도다.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    // 카카오 장소 검색을 부르는 RestClient 용. webmvc 스타터에는 RestClient 클래스만 들어
    // 있고 RestClient.Builder <b>빈</b>을 만들어 주는 자동설정은 이 모듈에 있다 — 빠뜨리면
    // 기동이 NoSuchBeanDefinition 으로 죽는다 (flyway 와 같은 함정).
    implementation 'org.springframework.boot:spring-boot-restclient'
    // 비밀번호 재설정 메일 발송 (계약서 §3-3, v1.23.0). JavaMailSender 가 여기 있다.
    // supervisor 승인 후 추가 — CLAUDE.md 가 스택 임의 변경을 금지한다.
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // 같은 통합 테스트를 실제 PostgreSQL 로도 돌리기 위한 것. 기본 test 는 여전히 H2 라
    // 이 의존성이 있어도 Docker 없이 ./gradlew test 는 그대로 돈다.
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

/*
 * 약관·개인정보처리방침 마크다운을 jar 에 싣는다 (계약서 §3, v1.21.0).
 *
 * 원본은 docs/ 에 있고 사람이 거기서 고친다. 그런데 docs/ 는 클래스패스가 아니라서
 * 배포된 jar 안에서는 읽을 수 없다 — 그래서 빌드할 때 리소스로 복사한다.
 *
 * <b>복사본을 저장소에 두지 않는 게 핵심이다.</b> 두 벌을 커밋해 두면 docs/ 만 고치고
 * 배포하는 날이 오는데, 그때 페이지는 옛 문서를 계속 내놓으면서 에러는 없다. 문의처가
 * 바뀌었는데 예전 주소가 그대로 보이는 식이다. 빌드가 매번 복사하면 어긋날 자리가 없다.
 */
tasks.named('processResources') {
    from('docs') {
        include 'terms-of-service.md'
        include 'privacy-policy.md'
        into 'legal'
    }

    // 고객센터 FAQ·AI 지식 (계약서 §7-1, v1.22.0). 같은 방식으로 나른다 —
    // 원본은 docs/ 한 벌이고 supervisor 가 거기서 고친다.
    from('docs') {
        include 'support-knowledge.md'
        into 'support'
    }

    /*
     * 복사가 실제로 됐는지 확인하고, 안 됐으면 <b>빌드를 세운다.</b>
     *
     * Gradle 의 from() 은 원본 디렉터리가 없어도 조용히 성공한다. 그래서 docs/ 가 없는
     * 환경에서 빌드하면 리소스가 빠진 jar 가 아무 경고 없이 만들어지고, 그걸 배포하면
     * /terms·/privacy 만 500 이 난다 — API 는 멀쩡해서 한참 모른다.
     *
     * 2026-09-01 에 정확히 그렇게 배포했다. .dockerignore 가 docs 를 빼고 있었고
     * Dockerfile 도 복사하지 않았는데, 로컬은 docs/ 가 있어서 테스트까지 다 통과했다.
     * <b>로컬 빌드와 배포 빌드가 다르다</b>는 걸 테스트로는 잡을 수 없어서 여기서 잡는다.
     */
    doLast {
        def resources = layout.buildDirectory.dir('resources/main').get().asFile
        ['legal/terms-of-service.md',
         'legal/privacy-policy.md',
         'support/support-knowledge.md'].each { name ->
            if (!new File(resources, name).exists()) {
                def source = name.substring(name.indexOf('/') + 1)
                throw new GradleException("""문서가 리소스에 안 실렸습니다: ${name}
  docs/${source} 가 빌드 컨텍스트에 있는지 확인하세요.
  도커 빌드라면 .dockerignore 의 docs 예외와 Dockerfile 의 COPY docs docs 를 함께 보세요.
  이 검사가 없으면 리소스가 빠진 jar 가 조용히 만들어져 운영에서 그 문서를 읽는 API 만 500 이 납니다.""")
            }
        }
    }
}

/*
 * 같은 통합 테스트를 실제 PostgreSQL 컨테이너에서 한 번 더 돌린다.
 *
 * 테스트를 따로 쓰지 않고 <b>같은 클래스를 다시 실행</b>하는 게 핵심이다. PG 전용 테스트를
 * 별도로 두면 시간이 지나며 커버리지가 벌어지고, 정작 새로 추가한 쿼리는 H2 에서만 검증되는
 * 상태가 된다 — lower(bytea) 사고가 정확히 그런 종류였다.
 *
 * 기본 test 는 H2 그대로다. Docker 가 없는 환경에서도 개발이 막히지 않아야 하고,
 * 빠른 피드백 루프도 지켜야 한다.
 */
tasks.register('postgresTest', Test) {
    group = 'verification'
    description = '통합 테스트를 실제 PostgreSQL 컨테이너에서 실행한다 (Docker 필요)'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()

    // IntegrationTestSupport 가 이 값을 보고 컨테이너를 띄운다.
    systemProperty 'kickoff.test.db', 'postgres'

    // 결과를 기본 test 와 섞지 않는다. 두 실행의 성패를 따로 봐야 한다.
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/postgresTest')
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/postgresTest')
    binaryResultsDirectory = layout.buildDirectory.dir('test-results/postgresTest/binary')

    shouldRunAfter tasks.named('test')
}


