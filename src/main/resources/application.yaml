spring:
  # 외부 장소 검색이 느려지면 우리 요청 스레드가 같이 묶인다. 사용자가 검색창에서
  # 기다려 줄 만한 시간으로 끊고, 그 뒤는 502 PLACE_SEARCH_FAILED 로 넘긴다.
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s
  application:
    name: be
  profiles:
    active: dev
  # SMTP (계약서 §3-3, v1.23.0). <b>값을 여기 적지 말 것</b> — 저장소에 커밋된다.
  # 로컬은 gitignore 된 local.yaml, 배포는 환경변수. Gmail 은 계정 비밀번호가 아니라
  # <b>앱 비밀번호</b>를 요구한다.
  # 셋 중 하나라도 비면 SMTP 어댑터가 등록되지 않고 LoggingEmailClient 가 남는다.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    time-zone: Asia/Seoul
    # 계약서가 null 필드(contact, myRequestStatus 등)도 키를 유지하길 기대한다
    default-property-inclusion: always
    datatype:
      # Jackson 3 에서 날짜 플래그는 SerializationFeature 가 아니라 DateTimeFeature 로 옮겨졌다
      datetime:
        write-dates-as-timestamps: false
        adjust-dates-to-context-time-zone: false
  web:
    resources:
      cache:
        cachecontrol:
          # 정적 자원은 지금 공유 카드 이미지 한 장뿐이다 (GET /share-card.png).
          # 카카오가 카드 이미지를 자기 쪽에 캐시하므로 길게 잡아도 되지만, 브랜딩을
          # 고쳤을 때 하루 안에는 새 그림이 도는 편이 낫다.
          max-age: 1d
          cache-public: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        timezone:
          default_storage: NORMALIZE

server:
  # Railway 같은 PaaS 는 PORT 를 주입한다. 없으면 로컬 기본값.
  port: ${PORT:8080}
  address: 0.0.0.0
  # 종료 신호를 받으면 처리 중인 요청을 마치고 내려간다. 명시하는 이유는 지금 동작이
  # 버전 기본값에 기대고 있어서다 — 기동 로그에 graceful shutdown 이 찍히는 것은
  # 확인했지만, 부트 버전이 바뀌면 조용히 즉시 종료로 돌아갈 수 있다.
  # 배포는 롤링이라, 즉시 종료면 그 순간 처리 중이던 요청이 그냥 끊긴다.
  shutdown: graceful

place:
  kakao:
    # 카카오 로컬 API REST 키 (계약서 §5-1). 로그인용 KAKAO_CLIENT_ID 와 <b>같은 앱의
    # 키여도 된다</b> — 현재 운영이 그렇다. 변수를 따로 둔 것은 나중에 앱을 분리할 때
    # 이 값만 바꾸면 되게 하려는 것이다. 다만 로그인 키를 여기 넣을 때는 그 앱에
    # 카카오맵/로컬 API 가 켜져 있어야 한다 — 안 켜져 있으면 검색만 502 가 되고
    # 나머지는 멀쩡해서 눈치채기 어렵다.
    # 값을 여기 적지 말 것 — 저장소에 커밋된다.
    rest-key: ${KAKAO_MAP_REST_KEY:}

holiday:
  kakao:
    # 카카오 톡캘린더 어드민 키 — 공휴일 조회 (계약서 §8-2).
    # 카카오 개발자 콘솔 › 앱 키 › Admin 키. 헤더 Authorization: KakaoAK {키} 로 보낸다.
    # 로그인에 쓰는 REST API 키(KAKAO_CLIENT_ID)와 다른 값이고, 이쪽은 서버 전용 비밀값이다.
    # 톡캘린더 활성화나 추가 콘솔 설정은 필요 없다(문서상 요구 사항 없음).
    # 없으면 공휴일 조회가 source NONE 으로 나간다(FE 가 계산값으로 폴백). 기동은 정상이다.
    # 값을 여기 적지 말 것 — 저장소에 커밋된다.
    admin-key: ${KAKAO_ADMIN_KEY:}

chat:
  internal:
    # 채팅 서버(kickoff_chat)와의 공유 비밀 (계약서 §10, v1.31.0).
    # 양 서버가 같은 값을 갖고, 헤더 X-Internal-Secret 로 주고받는다. 비교는 상수 시간이다.
    # <b>비어 있으면 닫힌 쪽으로 실패한다</b> — /internal/** 전체가 401 이고 이벤트 전달도
    # 멈춘다(chat_outbox 에 쌓이기만 한다). 기동과 다른 API 는 정상이다.
    # <b>비밀값이다.</b> 사용자 토큰과 달리 이 값 하나로 내부 API 전체가 열린다 —
    # FE 번들·로그·저장소 금지. 값을 여기 적지 말 것 — 저장소에 커밋된다.
    secret: ${CHAT_INTERNAL_SECRET:}
    # 채팅 서버 주소. 이벤트(POST /internal/events)를 보내는 곳이다.
    # 비어 있으면 비밀값이 없을 때와 같이 전달을 멈춘다 — 보낼 곳을 모르는 채로 재시도만
    # 쌓을 이유가 없다. dev 기본값은 아래 dev 블록에 있다.
    url: ${CHAT_INTERNAL_URL:}
  outbox:
    # 미전송 PURGE(탈퇴 대화 삭제 요청)가 이만큼 묵으면 ERROR 로그를 남긴다 (법률 점검 11절).
    # 전달은 횟수 제한 없이 재시도하므로, 이 경보가 없으면 계속 실패해도 시스템은 조용하다 —
    # 그동안 탈퇴한 사람의 대화가 채팅 서버에 그대로 남는다(개인정보 보호법 제21조
    # "지체 없이"). ROOM_INVALIDATED 는 대상이 아니다: 늦어도 채팅 서버의 15초 캐시가 메운다.
    # 같은 행에 대해서는 이 간격마다 한 번만 찍는다.
    purge-alert-after: ${CHAT_OUTBOX_PURGE_ALERT_AFTER:1h}

stadium:
  seoul:
    # 서울 열린데이터광장 인증키 (계약서 §8-1, v1.27.0).
    # <b>없는 것이 기본 상태다</b> — 없으면 공공 동기화를 건너뛰고 수동 시드만 노출한다.
    # 기동도 목록 조회도 막히지 않는다. 키는 사용자가 직접 신청해야 발급된다.
    # 값을 여기 적지 말 것 — 저장소에 커밋된다.
    key: ${SEOUL_OPENDATA_KEY:}

kickoff:
  push:
    # 기본 off. dev 에서 실수로 실기기에 알림이 나가지 않게 한다 (계약서 §8).
    enabled: ${PUSH_ENABLED:false}
  sms:
    # 기본 off (계약서 §3-2). dev 에서는 실제로 보내지 않고 인증번호를 서버 로그로만 남긴다.
    # 운영에서 켜려면 제공자 어댑터가 함께 있어야 한다 — 없으면 502 로 실패한다.
    enabled: ${SMS_ENABLED:false}
    solapi:
      # 솔라피(쿨SMS) 접속 정보. **값을 여기 적지 말 것** — 저장소에 커밋된다.
      # 로컬은 gitignore 된 local.yaml, 배포는 환경변수로 넣는다. 키는 로테이션 대상이라
      # 한 번 커밋되면 이력에서 지울 수 없다.
      # 셋 중 하나라도 비면 어댑터가 등록되지 않고 LoggingSmsClient 가 남는다.
      api-key: ${SOLAPI_API_KEY:}
      api-secret: ${SOLAPI_API_SECRET:}
      sender: ${SMS_SENDER:}
  verification:
    # signup·PATCH 의 전화번호에 verificationToken 을 강제할지 (계약서 §3-2, 기본 false).
    # 토큰 없이 가입하는 구버전 앱이 도는 동안 꺼 둔다. 꺼져 있어도 토큰이 오면 검증한다.
    # 롤아웃 순서: BE 배포 → FE 배포 → preview 재빌드·배포 → true 전환.
    phone-required: ${PHONE_VERIFICATION_REQUIRED:false}
  email:
    # 비밀번호 재설정 메일 (계약서 §3-3, v1.23.0). 기본 off — dev 에서는 실제로 보내지
    # 않고 인증번호를 서버 로그로만 남긴다. 문자와 같은 방침이다.
    enabled: ${EMAIL_ENABLED:false}
    brevo:
      # HTTP 메일 발송 (Brevo). **값을 여기 적지 말 것** — 저장소에 커밋된다.
      #
      # Railway 가 아웃바운드 SMTP 를 막아서(587 TCP 타임아웃, 스팸 방지 정책) SMTP 로는
      # 운영에서 메일을 보낼 수 없다. 인증 이전 단계라 앱 비밀번호나 STARTTLS 로 풀리지
      # 않고, 465 도 같은 정책이다. 그래서 HTTPS 로 보내는 어댑터를 1순위로 둔다.
      #
      # 이 키가 있으면 SMTP 설정이 함께 있어도 Brevo 가 이긴다 (EmailClientConfig 참고).
      api-key: ${BREVO_API_KEY:}
    # 발신 주소. 비우면 spring.mail.username 을 쓴다 — Gmail 은 이 둘이 다르면 거절한다.
    from: ${EMAIL_FROM:}
  support:
    # 운영자 계정 이메일 (계약서 §7-1, v1.22.0). <b>미설정이면 문의함 API 가 전부 403</b> 이다 —
    # 운영자가 아무도 없는 상태를 기본값으로 둬서, 설정을 빠뜨린 배포가 남의 문의를 열어
    # 주는 일이 없게 한다.
    operator-email: ${SUPPORT_OPERATOR_EMAIL:}
  ai-support:
    # 기본 off. 꺼져 있으면 FAQ 와 운영자 연결만 동작하고 AI 는 부르지 않는다.
    # 키가 있어도 이 스위치를 켜기 전에는 호출하지 않는다 — 크레딧이 소모되는 자리라
    # "키를 넣었더니 돌더라"가 되면 안 된다.
    enabled: ${AI_SUPPORT_ENABLED:false}
    # **값을 여기 적지 말 것** — 저장소에 커밋된다. 로컬은 gitignore 된 local.yaml,
    # 배포는 환경변수. 키가 비면 어댑터 자체가 등록되지 않는다.
    api-key: ${ANTHROPIC_API_KEY:}
    # 고객센터 답변 한 줄에 비싼 모델을 쓸 이유가 없다.
    model: ${AI_SUPPORT_MODEL:claude-haiku-4-5-20251001}

  # 시드 데이터 투입 여부. 배포 환경 기본값은 off 다.
  #
  # <b>운영(prod)에서는 절대 켜지 않는다.</b> 시드 계정의 이메일과 공통 비밀번호가 공개
  # 저장소의 README 에 적혀 있어서, 운영에 들어가면 누구나 그 계정으로 로그인할 수 있다.
  # 켠 채로 prod 로 뜨면 SeedDataGuard 가 기동을 거부한다 — 문서가 아니라 코드로 막는다.
  # 화면에 보여 줄 데이터가 필요하면 시드가 아니라 실제 계정으로 만든다.
  seed-data: ${SEED_DATA:false}

  legal:
    # 현행 약관·개인정보처리방침의 시행일 (계약서 §3 「동의」, v1.34.1).
    #
    # <b>이 값 하나가 "누가 다시 동의해야 하는가"를 정한다.</b> 동의 기록이 이 시각보다
    # 이르면 받아야 하는 항목이 된다 — 소셜 최초 로그인, 구조 개편 전 가입자, 개정 후
    # 재동의가 모두 이 한 규칙으로 덮인다.
    #
    # <b>문서를 개정하면 이 값을 함께 올린다.</b> 올리지 않으면 개정된 문서가 서빙되는데
    # 아무도 다시 동의하지 않는 상태가 되고, 그건 화면에 드러나지 않는다.
    # FE 는 이 값을 갖지 않는다(옛 상수 TERMS_EFFECTIVE_AT 폐지) — 양쪽에 두면 개정하는
    # 날 한쪽만 올라가서 동의 화면이 안 뜨거나 영원히 뜬다.
    #
    # <b>아직 오지 않은 날짜를 넣지 않는다.</b> 판정은 동의 시각이 이 값보다 이른지라서,
    # 미래 날짜를 넣으면 그때까지 전원이 403 이고 다시 동의해도 풀리지 않는다. 개정 약관을
    # 미리 공지하는 기간에는 값을 그대로 두고, 시행일이 지난 뒤에 올린다.
    effective-at: ${LEGAL_EFFECTIVE_AT:2026-09-08T00:00:00+09:00}
  match:
    # 경기 뒤 연락처·계좌가 상대 팀에게 보이는 기간 (계약서 §5 「표시 기간」, v1.34.1).
    #
    # 연락처는 "매칭 성사 시 상대 팀 감독에게 제공"에 동의해서 넘어간 값이고, 그 동의
    # 문구의 보유·이용 기간이 이 값이다 — 무기한 보이면 동의한 범위를 넘는다.
    # 글 작성자가 자기 글에서 보는 계좌는 이 기간과 무관하다(자기 값 확인·수정용).
    # 숫자를 바꾸면 FE 안내 문구("경기 후 14일")도 함께 고쳐야 한다 — 계약서 §5 참고.
    contact-visible-days: ${MATCH_CONTACT_VISIBLE_DAYS:14}
  account:
    # 모집글 입금 계좌를 암호화해 저장하는 키 (계약서 §5). AES-256 이라 <b>32바이트</b>를
    # base64 로 인코딩한 값이다.
    #
    # <b>없거나 길이가 틀리면 서버가 뜨지 않는다.</b> 키 없이 뜨게 해 두면 그 배포는 계좌를
    # 평문으로 쌓거나 저장을 조용히 건너뛴다 — 어느 쪽이든 나중에 알아챈다.
    # 개발 기본값은 아래 dev 블록에 있다(그 값으로 암호화한 데이터는 개발용 시드뿐이다).
    #
    # <b>키를 잃으면 저장된 계좌를 읽을 수 없다.</b> 복구 수단이 없으므로 운영 키는 따로
    # 보관할 것. 값을 여기 적지 말 것 — 저장소에 커밋된다.
    encryption-key: ${ACCOUNT_ENC_KEY:}

auth:
  cookie:
    # 웹의 refresh token 쿠키 속성 (계약서 §3 「웹의 토큰 전달」, v1.32.0).
    # 이름은 kickoff_rt, HttpOnly·Path=/api/auth 는 코드에 고정이다 — 설정으로 풀면
    # "스크립트가 못 읽는다"와 "다른 API 에는 안 실린다"는 보장이 설정 실수로 사라진다.
    #
    # <b>운영에서 끄지 말 것.</b> 평문 구간이 한 번이라도 있으면 30일짜리 토큰이 그대로
    # 네트워크에 흐른다. 개발 기본값만 false 인 것은 http://localhost 라서다 —
    # Secure 를 붙이면 브라우저가 쿠키를 저장하지 않는다(아래 dev 블록).
    secure: ${AUTH_COOKIE_SECURE:true}
    # Strict / Lax / None. 웹과 API 를 같은 사이트에 두는 것이 전제라 Strict 로 충분하다.
    # None 으로 바꾸면 요청 위조 방어가 한 겹 얇아지고, Secure 없이 None 이면 브라우저가
    # 쿠키를 아예 거부한다(기동 때 WARN 한 줄이 나간다).
    same-site: ${AUTH_COOKIE_SAMESITE:Strict}
    # 비우면 요청 호스트에만 붙는다(기본). 서브도메인끼리 공유해야 할 때만 쓴다 —
    # 넓히면 그 도메인 아래 모든 호스트가 이 쿠키를 보게 된다.
    domain: ${AUTH_COOKIE_DOMAIN:}

jwt:
  # 운영에서는 반드시 JWT_SECRET 환경변수로 덮어쓸 것 (HS256이라 32바이트 이상 필요)
  secret: ${JWT_SECRET:kickoff-local-dev-secret-key-change-me-in-production-0123456789}
  # v1.7.0 부터 access 는 짧게 가고 refresh 로 이어붙인다 (계약서 §3).
  # access 가 길면 유출된 토큰을 만료 말고는 막을 방법이 없다. refresh 는 서버에
  # 해시로 저장돼 있어 로그아웃·재로그인으로 즉시 끊을 수 있다.
  access-expiration: 1h
  refresh-expiration: 30d

oauth:
  # 클라이언트 키는 환경변수로만 들어온다. 값을 여기 적지 말 것 — 저장소에 커밋된다.
  # 키가 없는 제공자는 아예 등록되지 않고 400 UNSUPPORTED_PROVIDER 로 응답한다.
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
  # 비우면 authorize 요청의 오리진을 그대로 쓴다 (localhost / LAN IP 양쪽 대응).
  # 제공자 콘솔에 등록한 주소와 반드시 일치해야 토큰 교환이 통과한다.
  callback-base-url: ${OAUTH_CALLBACK_BASE_URL:}

---
spring:
  config:
    activate:
      on-profile: dev
    # 로컬 전용 키 파일. dev 에서만 읽는다 — 루트에 두면 테스트까지 이 파일을 집어와
    # 실제 키가 스텁을 밀어내고, CI 에는 파일이 없어 동작이 갈린다. optional 이라 없어도 뜬다.
    # .gitignore 에 걸려 있으니 커밋되지 않는다.
    import: "optional:file:./local.yaml"
  devtools:
    restart:
      # 끄는 이유: bootRun 이 떠 있는 채로 gradle 이 build/classes 를 다시 쓰면,
      # devtools 가 절반만 쓰인 클래스 디렉터리를 보고 재시작해버린다. 그러면 앱은
      # "Started" 를 찍고 살아 있는데 일부 컨트롤러가 매핑되지 않은 채로 뜬다.
      # 실제로 이 상태에서 GET /api/posts 가 500, GET /api/teams/1 이 404 로 나갔다.
      # 코드를 고치면 서버를 명시적으로 재시작할 것.
      enabled: false
  datasource:
    url: jdbc:h2:mem:kickoff;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # 스키마는 Flyway 가 만든다. validate 로 엔티티와 어긋나면 기동을 실패시킨다 —
      # 운영과 같은 마이그레이션을 개발에서도 매번 돌려 드리프트를 즉시 잡는다.
      ddl-auto: validate
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true

# 개발은 시드가 기본 on 이다. 끄고 싶으면 SEED_DATA=false.
kickoff:
  seed-data: ${SEED_DATA:true}
  account:
    # 개발·로컬 전용 키 (계약서 §5). 저장소에 적혀 있으므로 <b>비밀이 아니다</b> — 이
    # 값으로 암호화된 것은 개발 시드의 가짜 계좌뿐이다. 운영은 최상단의 빈 값을 쓰므로
    # ACCOUNT_ENC_KEY 를 주지 않으면 기동하지 않는다.
    encryption-key: ${ACCOUNT_ENC_KEY:ZGV2LW9ubHkta2V5LWZvci1hY2NvdW50LWVuYy0zMmI=}
  support:
    # 개발에서만 시드 계정 하나를 운영자로 지정한다 (계약서 §7-1, v1.22.0).
    # 미설정이면 문의함이 전부 403 이라 FE 가 <b>"안 보이는 것"까지만</b> 확인할 수 있다.
    #
    # 최총무를 고른 이유는 다른 시나리오에 가장 적게 얽혀 있어서다 — 김주장은 대기 중
    # 신청이 쌓인 페르소나이고, 정주장·윤코치는 수락된 매칭의 당사자다. 운영자 계정으로
    # 로그인하면 마이 탭에 문의함이 추가로 뜨므로, 일반 사용자 화면을 보려면 다른 계정을
    # 써야 한다. 얽힘이 적은 쪽을 운영자로 두면 그 전환이 덜 번거롭다.
    #
    # <b>운영에는 이 기본값이 없다.</b> 아래 prod 블록에 없고 최상단은 빈 값이라,
    # SUPPORT_OPERATOR_EMAIL 을 주지 않으면 운영자는 아무도 아니다.
    operator-email: ${SUPPORT_OPERATOR_EMAIL:choi@example.com}

# 개발은 http://localhost 라 Secure 쿠키를 저장하지 못한다 (계약서 §3, v1.32.0).
# 운영 기본값은 최상단의 true 다 — 여기서만 내린다.
auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}

# 채팅 서버 연결 (계약서 §10, v1.31.0). 개발 기본값이 있는 유일한 프로파일이다.
# 비밀값은 <b>채팅 서버의 dev 기본값과 같은 문자열</b>이어야 한다 — 다르면 양쪽이 조용히
# 401 만 주고받는다. 운영에는 이 블록이 없으므로 CHAT_INTERNAL_SECRET 을 주지 않으면
# /internal/** 이 전부 막힌다(의도된 기본값).
chat:
  internal:
    secret: ${CHAT_INTERNAL_SECRET:dev-only-chat-internal-secret}
    url: ${CHAT_INTERNAL_URL:http://localhost:8090}

# 로그인 완료 후 돌아갈 수 있는 주소 (계약서 §3-1).
# 개발 기본값은 넓다 — Expo Go 가 exp:// 로 돌아오기 때문. 운영은 아래 prod 블록 참고.
oauth:
  allowed-redirects:
    - "exp://*"
    - "kickoff://*"
    - "http://localhost:*"

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # 스키마를 만드는 유일한 경로. 배포마다 새 마이그레이션만 적용된다.
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  # PaaS 는 TLS 를 프록시에서 끊고 앱에는 평문 HTTP 로 넘긴다. 이 설정이 없으면
  # request.getScheme() 이 http, 호스트도 내부 값이라 요청에서 만들어내는 주소가 전부
  # 틀린다 — 소셜 로그인 콜백 URI 가 그렇다. X-Forwarded-* 를 믿게 해서 바로잡는다.
  # OAUTH_CALLBACK_BASE_URL 이 있으면 그 값이 우선이고, 이건 빠뜨렸을 때의 안전망이다.
  forward-headers-strategy: framework

# 운영 기본값은 앱 스킴만 — 넓은 기본값을 두면 나중에 좁히는 걸 잊는다.
# Expo Go 로 붙는 동안은 배포 시점에 OAUTH_ALLOWED_REDIRECTS 로 exp:// 를 명시적으로 더한다.
# 예) OAUTH_ALLOWED_REDIRECTS=kickoff://*,exp://*
oauth:
  allowed-redirects: ${OAUTH_ALLOWED_REDIRECTS:kickoff://*}
  callback-base-url: ${OAUTH_CALLBACK_BASE_URL:}
