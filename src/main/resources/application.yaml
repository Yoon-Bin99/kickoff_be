spring:
  # 외부 장소 검색이 느려지면 우리 요청 스레드가 같이 묶인다. 사용자가 검색창에서
  # 기다려 줄 만한 시간으로 끊고, 그 뒤는 502 PLACE_SEARCH_FAILED 로 넘긴다.
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s
  application:
    name: be
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Seoul
    # 계약서가 null 필드(contact, myRequestStatus 등)도 키를 유지하길 기대한다
    default-property-inclusion: always
    datatype:
      # Jackson 3 에서 날짜 플래그는 SerializationFeature 가 아니라 DateTimeFeature 로 옮겨졌다
      datetime:
        write-dates-as-timestamps: false
        adjust-dates-to-context-time-zone: false
  web:
    resources:
      cache:
        cachecontrol:
          # 정적 자원은 지금 공유 카드 이미지 한 장뿐이다 (GET /share-card.png).
          # 카카오가 카드 이미지를 자기 쪽에 캐시하므로 길게 잡아도 되지만, 브랜딩을
          # 고쳤을 때 하루 안에는 새 그림이 도는 편이 낫다.
          max-age: 1d
          cache-public: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        timezone:
          default_storage: NORMALIZE

server:
  # Railway 같은 PaaS 는 PORT 를 주입한다. 없으면 로컬 기본값.
  port: ${PORT:8080}
  address: 0.0.0.0

place:
  kakao:
    # 카카오 로컬 API REST 키. 로그인용 KAKAO_CLIENT_ID 와 <b>다른 앱</b>의 키다 (계약서 §5-1).
    # 값을 여기 적지 말 것 — 저장소에 커밋된다.
    rest-key: ${KAKAO_MAP_REST_KEY:}

kickoff:
  push:
    # 기본 off. dev 에서 실수로 실기기에 알림이 나가지 않게 한다 (계약서 §8).
    enabled: ${PUSH_ENABLED:false}
  sms:
    # 기본 off (계약서 §3-2). dev 에서는 실제로 보내지 않고 인증번호를 서버 로그로만 남긴다.
    # 운영에서 켜려면 제공자 어댑터가 함께 있어야 한다 — 없으면 502 로 실패한다.
    enabled: ${SMS_ENABLED:false}
    solapi:
      # 솔라피(쿨SMS) 접속 정보. **값을 여기 적지 말 것** — 저장소에 커밋된다.
      # 로컬은 gitignore 된 local.yaml, 배포는 환경변수로 넣는다. 키는 로테이션 대상이라
      # 한 번 커밋되면 이력에서 지울 수 없다.
      # 셋 중 하나라도 비면 어댑터가 등록되지 않고 LoggingSmsClient 가 남는다.
      api-key: ${SOLAPI_API_KEY:}
      api-secret: ${SOLAPI_API_SECRET:}
      sender: ${SMS_SENDER:}
  verification:
    # signup·PATCH 의 전화번호에 verificationToken 을 강제할지 (계약서 §3-2, 기본 false).
    # 토큰 없이 가입하는 구버전 앱이 도는 동안 꺼 둔다. 꺼져 있어도 토큰이 오면 검증한다.
    # 롤아웃 순서: BE 배포 → FE 배포 → preview 재빌드·배포 → true 전환.
    phone-required: ${PHONE_VERIFICATION_REQUIRED:false}
  support:
    # 운영자 계정 이메일 (계약서 §7-1, v1.22.0). <b>미설정이면 문의함 API 가 전부 403</b> 이다 —
    # 운영자가 아무도 없는 상태를 기본값으로 둬서, 설정을 빠뜨린 배포가 남의 문의를 열어
    # 주는 일이 없게 한다.
    operator-email: ${SUPPORT_OPERATOR_EMAIL:}
  ai-support:
    # 기본 off. 꺼져 있으면 FAQ 와 운영자 연결만 동작하고 AI 는 부르지 않는다.
    # 키가 있어도 이 스위치를 켜기 전에는 호출하지 않는다 — 크레딧이 소모되는 자리라
    # "키를 넣었더니 돌더라"가 되면 안 된다.
    enabled: ${AI_SUPPORT_ENABLED:false}
    # **값을 여기 적지 말 것** — 저장소에 커밋된다. 로컬은 gitignore 된 local.yaml,
    # 배포는 환경변수. 키가 비면 어댑터 자체가 등록되지 않는다.
    api-key: ${ANTHROPIC_API_KEY:}
    # 고객센터 답변 한 줄에 비싼 모델을 쓸 이유가 없다.
    model: ${AI_SUPPORT_MODEL:claude-haiku-4-5-20251001}

  # 시드 데이터 투입 여부. 배포 환경 기본값은 off — 운영 DB 에 예제 데이터가 들어가면 안 된다.
  # 첫 배포 직후 화면 확인용으로만 SEED_DATA=true 로 한 번 켠다.
  seed-data: ${SEED_DATA:false}

jwt:
  # 운영에서는 반드시 JWT_SECRET 환경변수로 덮어쓸 것 (HS256이라 32바이트 이상 필요)
  secret: ${JWT_SECRET:kickoff-local-dev-secret-key-change-me-in-production-0123456789}
  # v1.7.0 부터 access 는 짧게 가고 refresh 로 이어붙인다 (계약서 §3).
  # access 가 길면 유출된 토큰을 만료 말고는 막을 방법이 없다. refresh 는 서버에
  # 해시로 저장돼 있어 로그아웃·재로그인으로 즉시 끊을 수 있다.
  access-expiration: 1h
  refresh-expiration: 30d

oauth:
  # 클라이언트 키는 환경변수로만 들어온다. 값을 여기 적지 말 것 — 저장소에 커밋된다.
  # 키가 없는 제공자는 아예 등록되지 않고 400 UNSUPPORTED_PROVIDER 로 응답한다.
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
  # 비우면 authorize 요청의 오리진을 그대로 쓴다 (localhost / LAN IP 양쪽 대응).
  # 제공자 콘솔에 등록한 주소와 반드시 일치해야 토큰 교환이 통과한다.
  callback-base-url: ${OAUTH_CALLBACK_BASE_URL:}

---
spring:
  config:
    activate:
      on-profile: dev
    # 로컬 전용 키 파일. dev 에서만 읽는다 — 루트에 두면 테스트까지 이 파일을 집어와
    # 실제 키가 스텁을 밀어내고, CI 에는 파일이 없어 동작이 갈린다. optional 이라 없어도 뜬다.
    # .gitignore 에 걸려 있으니 커밋되지 않는다.
    import: "optional:file:./local.yaml"
  devtools:
    restart:
      # 끄는 이유: bootRun 이 떠 있는 채로 gradle 이 build/classes 를 다시 쓰면,
      # devtools 가 절반만 쓰인 클래스 디렉터리를 보고 재시작해버린다. 그러면 앱은
      # "Started" 를 찍고 살아 있는데 일부 컨트롤러가 매핑되지 않은 채로 뜬다.
      # 실제로 이 상태에서 GET /api/posts 가 500, GET /api/teams/1 이 404 로 나갔다.
      # 코드를 고치면 서버를 명시적으로 재시작할 것.
      enabled: false
  datasource:
    url: jdbc:h2:mem:kickoff;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # 스키마는 Flyway 가 만든다. validate 로 엔티티와 어긋나면 기동을 실패시킨다 —
      # 운영과 같은 마이그레이션을 개발에서도 매번 돌려 드리프트를 즉시 잡는다.
      ddl-auto: validate
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true

# 개발은 시드가 기본 on 이다. 끄고 싶으면 SEED_DATA=false.
kickoff:
  seed-data: ${SEED_DATA:true}
  support:
    # 개발에서만 시드 계정 하나를 운영자로 지정한다 (계약서 §7-1, v1.22.0).
    # 미설정이면 문의함이 전부 403 이라 FE 가 <b>"안 보이는 것"까지만</b> 확인할 수 있다.
    #
    # 최총무를 고른 이유는 다른 시나리오에 가장 적게 얽혀 있어서다 — 김주장은 대기 중
    # 신청이 쌓인 페르소나이고, 정주장·윤코치는 수락된 매칭의 당사자다. 운영자 계정으로
    # 로그인하면 마이 탭에 문의함이 추가로 뜨므로, 일반 사용자 화면을 보려면 다른 계정을
    # 써야 한다. 얽힘이 적은 쪽을 운영자로 두면 그 전환이 덜 번거롭다.
    #
    # <b>운영에는 이 기본값이 없다.</b> 아래 prod 블록에 없고 최상단은 빈 값이라,
    # SUPPORT_OPERATOR_EMAIL 을 주지 않으면 운영자는 아무도 아니다.
    operator-email: ${SUPPORT_OPERATOR_EMAIL:choi@example.com}

# 로그인 완료 후 돌아갈 수 있는 주소 (계약서 §3-1).
# 개발 기본값은 넓다 — Expo Go 가 exp:// 로 돌아오기 때문. 운영은 아래 prod 블록 참고.
oauth:
  allowed-redirects:
    - "exp://*"
    - "kickoff://*"
    - "http://localhost:*"

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # 스키마를 만드는 유일한 경로. 배포마다 새 마이그레이션만 적용된다.
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  # PaaS 는 TLS 를 프록시에서 끊고 앱에는 평문 HTTP 로 넘긴다. 이 설정이 없으면
  # request.getScheme() 이 http, 호스트도 내부 값이라 요청에서 만들어내는 주소가 전부
  # 틀린다 — 소셜 로그인 콜백 URI 가 그렇다. X-Forwarded-* 를 믿게 해서 바로잡는다.
  # OAUTH_CALLBACK_BASE_URL 이 있으면 그 값이 우선이고, 이건 빠뜨렸을 때의 안전망이다.
  forward-headers-strategy: framework

# 운영 기본값은 앱 스킴만 — 넓은 기본값을 두면 나중에 좁히는 걸 잊는다.
# Expo Go 로 붙는 동안은 배포 시점에 OAUTH_ALLOWED_REDIRECTS 로 exp:// 를 명시적으로 더한다.
# 예) OAUTH_ALLOWED_REDIRECTS=kickoff://*,exp://*
oauth:
  allowed-redirects: ${OAUTH_ALLOWED_REDIRECTS:kickoff://*}
  callback-base-url: ${OAUTH_CALLBACK_BASE_URL:}
