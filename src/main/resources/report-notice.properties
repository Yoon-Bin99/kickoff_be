# 신고 처리 결과 통지 문구 (계약서 §7-2, v1.35.0).
#
# 법무 초안 docs/legal-drafts/consent-and-report-copy.md 3-3절의 문구를 그대로 옮긴 것이다.
# <b>해설과 근거는 옮기지 않는다</b> — 그쪽 문서가 정본이고, 여기는 화면에 나가는 문장만
# 둔다. 문구를 고쳐야 하면 그 문서를 먼저 고친다.
#
# {0} 같은 자리는 java.text.MessageFormat 이 채운다.

# 신고자에게 — 조치함. {0} = 조치 표시(삭제 / 임시 가림 / 이용 제한)
reporter.acted=신고해 주신 내용을 확인했고, 운영 정책에 따라 조치했습니다. (조치: {0})

# 신고자에게 — 조치하지 않음
reporter.dismissed=신고해 주신 내용을 확인했지만 운영 정책 위반으로 보기 어려워 조치하지 않았습니다. 상대와 더 마주치고 싶지 않다면 차단 기능을 이용해 주세요.

# 게재자에게 — 임시 가림. {0} = 대상 + 주격 조사("모집글이"/"리뷰가"/"팀 소개가"),
# {1} = 기한, {2} = 사유 범주.
# 조사를 "이(가)"로 두지 않는 것은 이용자에게 그대로 보이는 문장이기 때문이다 —
# 넣는 쪽(ReportNotices)이 받침을 보고 고른다.
reported.hidden=회원님의 {0} 신고가 접수되어 임시로 가려졌습니다({1}까지, 최대 30일).\n사유: {2}\n이의가 있으면 {1}까지 이 고객센터로 알려 주세요. 양쪽 의견을 확인한 뒤 복원하거나 삭제합니다.

# 게재자에게 — 자동 임시 가림. {0} = 대상, {1} = 기한
# 운영자 판단 전의 임시 조치이므로 "위반"이라고 단정하지 않는다.
reported.auto-hidden=회원님의 {0}에 여러 건의 신고가 접수되어 운영자가 확인할 때까지 임시로 가려졌습니다(최대 30일).\n운영자가 확인한 뒤 복원하거나 삭제하고 결과를 알려 드립니다. 의견이 있으면 {1}까지 이 고객센터로 알려 주세요.

# 게재자에게 — 삭제. {0} = 대상, {1} = 사유 범주
reported.removed=회원님의 {0} 운영 정책 위반으로 삭제됐습니다.\n사유: {1}\n이의가 있으면 14일 안에 이 고객센터로 알려 주세요.

# 게재자에게 — 이용 제한. {0} = 끝나는 날짜, {1} = 기간(일), {2} = 사유 범주
reported.suspended=회원님의 계정이 운영 정책 위반으로 {0}까지({1}일 동안) 이용이 제한됐습니다.\n사유: {2}\n이의가 있으면 14일 안에 이 고객센터로 알려 주세요.

# 게재자에게 — 복원(자동 가림이 풀린 경우). {0} = 대상
reported.restored=회원님의 {0} 확인 결과 운영 정책 위반으로 보기 어려워 다시 표시됩니다.
