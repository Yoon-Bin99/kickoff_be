# 테스트 전용 프로파일. dev 가 아니므로 DataInitializer(@Profile("dev"))는 돌지 않고,
# 각 테스트가 필요한 데이터만 직접 만든다.
spring:
  datasource:
    url: jdbc:h2:mem:kickoff-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # 스키마를 운영과 같은 마이그레이션으로 만들고 validate 로 대조한다.
  # V1 이 엔티티와 어긋나면 통합 테스트 전체가 기동 단계에서 실패한다.
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: kickoff-test-secret-key-0123456789-0123456789
  access-expiration: 1h
  refresh-expiration: 30d

# 소셜 로그인 테스트는 실제 키 없이 스텁 클라이언트로 돈다 (OAuthClientRegistry 가
# isConfigured() 인 것만 등록하므로, 키가 비어 있는 실 클라이언트는 자동으로 빠진다).
oauth:
  allowed-redirects:
    - "exp://*"
    - "kickoff://*"
    - "http://localhost:*"

# 푸시는 스텁으로 나가므로 켜 둔다. 꺼져 있으면 발송 자체가 없어 검증할 게 없다.
kickoff:
  push:
    enabled: true
  # 문자도 스텁으로 나가므로 켜 둔다 — 꺼져 있으면 서비스가 어댑터를 아예 부르지 않아
  # 스텁이 비고, 인증번호를 읽는 테스트가 전부 무너진다 (푸시와 같은 이유다).
  # SmsDisabledTest 만 이 값을 false 로 덮어 "꺼지면 안 나간다"를 따로 검증한다.
  sms:
    enabled: true
  # AI 도 스텁으로 나가므로 켜 둔다 (문자·푸시와 같은 이유). 키가 있어야 isUsable()
  # 이 통과하는데 실제 호출은 스텁이 받는다 — 진짜 제공자로는 절대 안 나간다.
  # AiDisabledTest 가 이 값을 false 로 덮어 "꺼지면 AI 가 답하지 않는다"를 따로 본다.
  ai-support:
    enabled: true
    api-key: test-key-not-real
  support:
    # 운영자 판정 대상. 이 이메일로 만든 계정만 문의함을 연다.
    operator-email: operator@kickoff.test
