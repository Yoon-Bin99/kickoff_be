# 테스트 전용 프로파일. dev 가 아니므로 DataInitializer(@Profile("dev"))는 돌지 않고,
# 각 테스트가 필요한 데이터만 직접 만든다.
spring:
  datasource:
    url: jdbc:h2:mem:kickoff-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: kickoff-test-secret-key-0123456789-0123456789
  expiration-days: 7
